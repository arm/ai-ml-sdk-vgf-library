[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel", "pybind11", "cmake>=3.22", "ninja>=1.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_ml_sdk_vgf_library"
description = "ML SDK VGF Library"
readme = "README.md"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [
    { name = "Arm Limited" }
]
requires-python = ">=3.10"

[project.scripts]
vgf_dump = "vgf_lib.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "pip_package"}

[tool.setuptools.packages.find]
where = ["pip_package"]

[tool.setuptools.package-data]
vgf_lib = ["binaries/**"]

[tool.setuptools_scm]
fallback_version = "0.11.0"

[tool.black]
target-version = ['py310']

[tool.pytest.ini_options]
markers = [
    "header_test",
    "module_table_test",
    "model_sequence_test",
    "model_resource_test",
    "constant_test"
]
