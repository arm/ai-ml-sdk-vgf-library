[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel", "pybind11", "cmake>=3.25", "ninja>=1.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_ml_sdk_vgf_library"
description = "ML SDK VGF Library"
readme = "README.md"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [
    { name = "Arm Limited" }
]
requires-python = ">=3.10"

[project.scripts]
vgf_dump = "vgf_lib.cli:main"

[tool.setuptools]
license-files = ["LICENSES/*.txt"]
include-package-data = true
package-dir = {"" = "pip_package"}

[tool.setuptools.packages.find]
where = ["pip_package"]

[tool.setuptools.package-data]
vgf_lib = ["binaries/**"]

[tool.setuptools_scm]
fallback_version = "0.11.0"

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair --exclude msvcp140.dll -w {dest_dir} -v {wheel}"

[tool.black]
target-version = ['py310']

[tool.uv]
managed = true

[dependency-groups]
test = [
    "numpy==2.1.3; python_version < '3.14'",
    "numpy==2.4.6; python_version >= '3.14'",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
]
tooling = [
    "argcomplete==3.6.2",
    "breathe==4.36.0",
    "build==1.3.0",
    "debian-inspector==31.1.0",
    "myst_parser==4.0.1",
    "pre-commit==4.5.1",
    "setuptools==68.0.0",
    "sphinx==8.1.3",
    "sphinx_rtd_theme==3.0.2",
    "wheel==0.41.2",
]

[tool.isort]
profile = "black"
force_single_line = true

[tool.pytest.ini_options]
markers = [
    "header_test",
    "module_table_test",
    "model_sequence_test",
    "model_resource_test",
    "constant_test"
]
