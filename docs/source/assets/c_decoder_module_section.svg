<svg xmlns="http://www.w3.org/2000/svg" width="420" height="753" viewBox="0 0 420 753" role="img" aria-labelledby="title desc">
<title id="title">Read modules</title><desc id="desc">Create a module-table decoder in caller storage, check for null, then inspect valid indices and code kind and presence before fetching borrowed code.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#273c49"/></marker></defs>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#172d3b} .heading {font-weight:bold;font-size:20px} .arrow {fill:none;stroke:#273c49;stroke-width:2;marker-end:url(#arrow)} rect {stroke:#355363;stroke-width:1.5}</style>
<rect width="100%" height="100%" fill="white" stroke="none"/>
<text x="210" y="30" text-anchor="middle" class="heading"><tspan x="210" dy="0">Read modules</tspan></text>
<rect x="22" y="58" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="92.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">1. Locate module section</tspan><tspan x="210.0" dy="25">Use checked header offset and size</tspan></text>
<path class="arrow" d="M210 140 V166"/>
<rect x="22" y="171" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="205.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">2. Size and allocate storage</tspan><tspan x="210.0" dy="25">For the module-table decoder</tspan></text>
<path class="arrow" d="M210 253 V279"/>
<rect x="22" y="284" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="318.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">3. Create module-table decoder</tspan><tspan x="210.0" dy="25">Null → stop; otherwise continue</tspan></text>
<path class="arrow" d="M210 366 V392"/>
<rect x="22" y="397" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="431.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">4. Read module count</tspan><tspan x="210.0" dy="25">Iterate valid module indices</tspan></text>
<path class="arrow" d="M210 479 V505"/>
<rect x="22" y="510" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="544.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">5. Read type, kind and presence</tspan><tspan x="210.0" dy="25">Graph/compute; SPIR-V™, GLSL, HLSL</tspan></text>
<path class="arrow" d="M210 592 V618"/>
<rect x="22" y="623" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="657.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">6. Read name, entry point and code</tspan><tspan x="210.0" dy="25">Code-less module → resolve externally</tspan></text>
</svg>
