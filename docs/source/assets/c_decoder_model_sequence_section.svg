<svg xmlns="http://www.w3.org/2000/svg" width="420" height="753" viewBox="0 0 420 753" role="img" aria-labelledby="title desc">
<title id="title">Read segments and bindings</title><desc id="desc">Allocate only model-sequence decoder storage. After successful creation, retrieve opaque binding-slot handles and pass them to reads on that decoder; no separate binding-slot decoder is allocated.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#273c49"/></marker></defs>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#172d3b} .heading {font-weight:bold;font-size:20px} .arrow {fill:none;stroke:#273c49;stroke-width:2;marker-end:url(#arrow)} rect {stroke:#355363;stroke-width:1.5}</style>
<rect width="100%" height="100%" fill="white" stroke="none"/>
<text x="210" y="30" text-anchor="middle" class="heading"><tspan x="210" dy="0">Read segments and bindings</tspan></text>
<rect x="22" y="58" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="92.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">1. Locate model-sequence section</tspan><tspan x="210.0" dy="25">Use checked header offset and size</tspan></text>
<path class="arrow" d="M210 140 V166"/>
<rect x="22" y="171" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="205.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">2. Size and allocate storage</tspan><tspan x="210.0" dy="25">For the model-sequence decoder</tspan></text>
<path class="arrow" d="M210 253 V279"/>
<rect x="22" y="284" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="318.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">3. Create model-sequence decoder</tspan><tspan x="210.0" dy="25">Null → stop; otherwise continue</tspan></text>
<path class="arrow" d="M210 366 V392"/>
<rect x="22" y="397" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="431.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">4. Read segment count</tspan><tspan x="210.0" dy="25">Iterate valid segment indices</tspan></text>
<path class="arrow" d="M210 479 V505"/>
<rect x="22" y="510" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="544.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">5. Get input/output/descriptor slots</tspan><tspan x="210.0" dy="25">Returned handles borrow section bytes</tspan></text>
<path class="arrow" d="M210 592 V618"/>
<rect x="22" y="623" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="657.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">6. Read slot count, binding and MRT ID</tspan><tspan x="210.0" dy="25">Use the same sequence decoder</tspan></text>
</svg>
