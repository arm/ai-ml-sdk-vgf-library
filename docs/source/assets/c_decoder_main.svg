<svg xmlns="http://www.w3.org/2000/svg" width="420" height="753" viewBox="0 0 420 753" role="img" aria-labelledby="title desc">
<title id="title">Header and section setup</title><desc id="desc">Caller loads backing, allocates header decoder storage, creates and checks header decoder, locates a section, allocates separate decoder storage and creates and checks its decoder.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#273c49"/></marker></defs>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#172d3b} .heading {font-weight:bold;font-size:20px} .arrow {fill:none;stroke:#273c49;stroke-width:2;marker-end:url(#arrow)} rect {stroke:#355363;stroke-width:1.5}</style>
<rect width="100%" height="100%" fill="white" stroke="none"/>
<text x="210" y="30" text-anchor="middle" class="heading"><tspan x="210" dy="0">Header and section setup</tspan></text>
<rect x="22" y="58" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="92.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">1. Load encoded file backing</tspan><tspan x="210.0" dy="25">Caller keeps bytes unchanged</tspan></text>
<path class="arrow" d="M210 140 V166"/>
<rect x="22" y="171" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="205.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">2. Size and allocate storage</tspan><tspan x="210.0" dy="25">For the header decoder object</tspan></text>
<path class="arrow" d="M210 253 V279"/>
<rect x="22" y="284" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="318.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">3. Create header decoder</tspan><tspan x="210.0" dy="25">Null → stop; otherwise continue</tspan></text>
<path class="arrow" d="M210 366 V392"/>
<rect x="22" y="397" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="431.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">4. Read section offset and size</tspan><tspan x="210.0" dy="25">Header checks do not decode sections</tspan></text>
<path class="arrow" d="M210 479 V505"/>
<rect x="22" y="510" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="544.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">5. Size and allocate section storage</tspan><tspan x="210.0" dy="25">Separate from encoded section bytes</tspan></text>
<path class="arrow" d="M210 592 V618"/>
<rect x="22" y="623" width="376" height="82" rx="8" fill="#edf4f7"/>
<text x="210.0" y="657.5" text-anchor="middle" class=""><tspan x="210.0" dy="0">6. Create required section decoder</tspan><tspan x="210.0" dy="25">Null → stop; otherwise read section</tspan></text>
</svg>
